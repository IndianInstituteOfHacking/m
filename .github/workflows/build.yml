name: Build RootBrowser Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================================================
  # LINUX — AppImage
  # ==========================================================================
  build-linux:
    name: Linux Installer (AppImage)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgl1-mesa-dev libxkbcommon-dev libxcb-* \
            libfontconfig1-dev libfreetype6-dev \
            librsvg2-bin imagemagick fonts-dejavu-core \
            wget file libfuse2

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Compile main.cpp
        run: |
          set -e
          ls -la
          if pkg-config --exists Qt6Widgets 2>/dev/null; then
            echo "Using pkg-config"
            g++ -std=c++17 -O2 -fPIC main.cpp -o rootbrowser-installer \
              $(pkg-config --cflags --libs Qt6Widgets)
          else
            echo "Using explicit Qt paths"
            g++ -std=c++17 -O2 -fPIC main.cpp -o rootbrowser-installer \
              -I"$QT_ROOT_DIR/include" \
              -I"$QT_ROOT_DIR/include/QtWidgets" \
              -I"$QT_ROOT_DIR/include/QtGui" \
              -I"$QT_ROOT_DIR/include/QtCore" \
              -L"$QT_ROOT_DIR/lib" \
              -lQt6Widgets -lQt6Gui -lQt6Core
          fi
          ls -la rootbrowser-installer
          file rootbrowser-installer

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp rootbrowser-installer AppDir/usr/bin/
          chmod +x AppDir/usr/bin/rootbrowser-installer

          cat > AppDir/rootbrowser-installer.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=RootBrowser Installer
          Exec=rootbrowser-installer
          Icon=rootbrowser-installer
          Categories=System;Utility;
          Terminal=false
          EOF

          # Placeholder icon — font explicitly specified
          convert -size 256x256 xc:'#4f83e0' \
            -font DejaVu-Sans -fill white -gravity center \
            -pointsize 140 -annotate +0+0 'R' \
            AppDir/rootbrowser-installer.png

          # Verify icon
          file AppDir/rootbrowser-installer.png
          ls -la AppDir/

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: |
          export OUTPUT=RootBrowser-Installer-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage
          ls -la *.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: RootBrowser-Installer-Linux
          path: '*.AppImage'
          if-no-files-found: error

  # ==========================================================================
  # WINDOWS — .exe
  # ==========================================================================
  build-windows:
    name: Windows Installer (.exe)
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile main.cpp
        shell: cmd
        run: |
          cl /nologo /std:c++17 /Zc:__cplusplus /permissive- /EHsc /O2 /MD /W3 ^
            /DUNICODE /D_UNICODE ^
            /I"%QT_ROOT_DIR%\include" ^
            /I"%QT_ROOT_DIR%\include\QtWidgets" ^
            /I"%QT_ROOT_DIR%\include\QtGui" ^
            /I"%QT_ROOT_DIR%\include\QtCore" ^
            main.cpp ^
            /Fe:rootbrowser-installer.exe ^
            /link ^
            /LIBPATH:"%QT_ROOT_DIR%\lib" ^
            Qt6Widgets.lib Qt6Gui.lib Qt6Core.lib ^
            Qt6EntryPoint.lib ^
            /SUBSYSTEM:WINDOWS

      - name: Verify exe
        shell: cmd
        run: |
          dir rootbrowser-installer.exe
          if not exist rootbrowser-installer.exe (echo BUILD FAILED & exit /b 1)

      - name: Deploy Qt DLLs
        shell: cmd
        run: |
          "%QT_ROOT_DIR%\bin\windeployqt.exe" ^
            --release --no-translations --no-system-d3d-compiler ^
            --no-opengl-sw --no-compiler-runtime ^
            rootbrowser-installer.exe

      - name: Create ZIP bundle
        shell: pwsh
        run: |
          $items = @('rootbrowser-installer.exe')
          foreach ($d in 'platforms','imageformats','styles','tls','networkinformation','resources') {
            if (Test-Path $d) { $items += $d }
          }
          $items += (Get-ChildItem -Filter *.dll | Select-Object -ExpandProperty Name)
          Compress-Archive -Path $items -DestinationPath RootBrowser-Installer-Windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: RootBrowser-Installer-Windows
          path: RootBrowser-Installer-Windows.zip
          if-no-files-found: error
