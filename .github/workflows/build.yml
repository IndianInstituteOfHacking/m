name: Build RootBrowser Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================================================
  # LINUX — AppImage build
  # ==========================================================================
  build-linux:
    name: Linux Installer (AppImage)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgl1-mesa-dev libxkbcommon-dev libxcb-* \
            libfontconfig1-dev libfreetype6-dev \
            librsvg2-bin imagemagick wget file fuse libfuse2

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtwebengine'
          cache: true

      - name: Compile installer.cpp
        run: |
          g++ -std=c++17 -O2 -fPIC installer.cpp -o rootbrowser-installer \
            $(pkg-config --cflags --libs Qt6Widgets)

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp rootbrowser-installer AppDir/usr/bin/
          chmod +x AppDir/usr/bin/rootbrowser-installer

          # Desktop entry
          cat > AppDir/rootbrowser-installer.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=RootBrowser Installer
          Exec=rootbrowser-installer
          Icon=rootbrowser-installer
          Categories=System;Utility;
          Terminal=false
          EOF

          # Icon (simple placeholder — apna icon daal sakte ho)
          convert -size 256x256 xc:'#4f83e0' \
            -fill white -gravity center -pointsize 120 -annotate +0+0 'R' \
            AppDir/rootbrowser-installer.png
          cp AppDir/rootbrowser-installer.png \
             AppDir/usr/share/icons/hicolor/256x256/apps/

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: |
          export OUTPUT=RootBrowser-Installer-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: RootBrowser-Installer-Linux
          path: RootBrowser-Installer-x86_64.AppImage
          if-no-files-found: error

  # ==========================================================================
  # WINDOWS — .exe build
  # ==========================================================================
  build-windows:
    name: Windows Installer (.exe)
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine'
          cache: true
          tools: 'tools_opensslv3_x64'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile installer.cpp
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /MD ^
            /I"%QT_ROOT_DIR%\include" ^
            /I"%QT_ROOT_DIR%\include\QtWidgets" ^
            /I"%QT_ROOT_DIR%\include\QtGui" ^
            /I"%QT_ROOT_DIR%\include\QtCore" ^
            installer.cpp ^
            /Fe:rootbrowser-installer.exe ^
            /link /LIBPATH:"%QT_ROOT_DIR%\lib" ^
            Qt6Widgets.lib Qt6Gui.lib Qt6Core.lib ^
            /SUBSYSTEM:WINDOWS

      - name: Deploy Qt DLLs
        shell: cmd
        run: |
          "%QT_ROOT_DIR%\bin\windeployqt.exe" ^
            --release --no-translations --no-system-d3d-compiler ^
            --no-opengl-sw ^
            rootbrowser-installer.exe

      - name: Create ZIP bundle
        shell: pwsh
        run: |
          Compress-Archive -Path rootbrowser-installer.exe, `
            *.dll, platforms, imageformats, styles, tls, `
            -DestinationPath RootBrowser-Installer-Windows.zip `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: RootBrowser-Installer-Windows
          path: RootBrowser-Installer-Windows.zip
          if-no-files-found: error
