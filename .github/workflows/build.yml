name: Build Installer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  #  Windows build (.exe via MSVC + Qt6)
  # ─────────────────────────────────────────────
  windows:
    name: Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 (MSVC 2022 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile installer.cpp
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /MD ^
             installer.cpp ^
             /Fe:rootbrowser-installer.exe ^
             /I"%Qt6_DIR%\include" ^
             /I"%Qt6_DIR%\include\QtWidgets" ^
             /I"%Qt6_DIR%\include\QtGui" ^
             /I"%Qt6_DIR%\include\QtCore" ^
             /link /LIBPATH:"%Qt6_DIR%\lib" ^
             Qt6Widgets.lib Qt6Gui.lib Qt6Core.lib ^
             user32.lib shell32.lib gdi32.lib ole32.lib

      - name: Deploy Qt DLLs
        shell: cmd
        run: |
          windeployqt --no-translations --no-compiler-runtime ^
                      --no-system-d3d-compiler --no-opengl-sw ^
                      rootbrowser-installer.exe

      - name: Zip Windows package
        shell: pwsh
        run: |
          Compress-Archive -Path rootbrowser-installer.exe, Qt6*.dll, platforms\*, styles\* -DestinationPath rootbrowser-installer-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootbrowser-installer-windows
          path: rootbrowser-installer-windows.zip

  # ─────────────────────────────────────────────
  #  Linux build (AppImage)
  # ─────────────────────────────────────────────
  linux:
    name: Linux Installer (AppImage)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            qt6-base-dev libgl1-mesa-dev \
            libfuse2 file wget

      - name: Compile installer.cpp
        run: |
          g++ -std=c++17 -O2 -fPIC installer.cpp -o rootbrowser-installer \
              $(pkg-config --cflags --libs Qt6Widgets)

      - name: Build AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp rootbrowser-installer AppDir/usr/bin/
          cat > AppDir/rootbrowser-installer.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=RootBrowser Installer
          Exec=rootbrowser-installer
          Icon=rootbrowser
          Categories=System;
          EOF
          cp rootbrowser.svg AppDir/rootbrowser.svg 2>/dev/null || true

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Create AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/rootbrowser-installer.desktop \
            --icon-file AppDir/rootbrowser.svg \
            --output appimage \
            || true
          ls -la *.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootbrowser-installer-linux
          path: '*.AppImage'

  # ─────────────────────────────────────────────
  #  GitHub Release (only on tags like v1.0.0)
  # ─────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [ windows, linux ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rootbrowser-installer-windows/*.zip
            rootbrowser-installer-linux/*.AppImage
          generate_release_notes: true
