name: Build Installer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ═════════════════════════════════════════════
  #  Windows build (.exe via MSVC + Qt6)
  # ═════════════════════════════════════════════
  windows:
    name: Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 6 (MSVC 2022 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          arch: 'win64_msvc2022_64'
          cache: true
          modules: 'qtwebengine'

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify Qt installation
        shell: cmd
        run: |
          echo "QT_ROOT_DIR = %QT_ROOT_DIR%"
          dir "%QT_ROOT_DIR%\include" | findstr /I "QtWidgets"
          dir "%QT_ROOT_DIR%\lib" | findstr /I "Qt6Widgets"

      - name: Compile installer.cpp
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /MD ^
             installer.cpp ^
             /Fe:rootbrowser-installer.exe ^
             /I"%QT_ROOT_DIR%\include" ^
             /I"%QT_ROOT_DIR%\include\QtWidgets" ^
             /I"%QT_ROOT_DIR%\include\QtGui" ^
             /I"%QT_ROOT_DIR%\include\QtCore" ^
             /link /LIBPATH:"%QT_ROOT_DIR%\lib" ^
             Qt6Widgets.lib Qt6Gui.lib Qt6Core.lib ^
             user32.lib shell32.lib gdi32.lib ole32.lib advapi32.lib

      - name: Deploy Qt DLLs
        shell: cmd
        run: |
          "%QT_ROOT_DIR%\bin\windeployqt.exe" --no-translations --no-compiler-runtime ^
                      --no-system-d3d-compiler --no-opengl-sw ^
                      rootbrowser-installer.exe

      - name: Zip Windows package
        shell: pwsh
        run: |
          $files = @("rootbrowser-installer.exe")
          $files += Get-ChildItem -Filter "Qt6*.dll" | ForEach-Object { $_.Name }
          if (Test-Path "platforms") { $files += "platforms" }
          if (Test-Path "styles")    { $files += "styles" }
          if (Test-Path "imageformats") { $files += "imageformats" }
          Compress-Archive -Path $files -DestinationPath rootbrowser-installer-windows.zip -Force
          Get-Item rootbrowser-installer-windows.zip | Format-List

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootbrowser-installer-windows
          path: rootbrowser-installer-windows.zip
          if-no-files-found: error

  # ═════════════════════════════════════════════
  #  Linux build (AppImage)
  # ═════════════════════════════════════════════
  linux:
    name: Linux Installer (AppImage)
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      QMAKE_CFLAGS_RELEASE: "-O2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            qt6-base-dev libgl1-mesa-dev libglu1-mesa-dev \
            libfuse2 file wget rsync

      - name: Verify Qt6 dev packages
        run: |
          pkg-config --modversion Qt6Widgets
          pkg-config --modversion Qt6Gui
          pkg-config --modversion Qt6Core

      - name: Compile installer.cpp
        run: |
          set -e
          g++ -std=c++17 -O2 -fPIC installer.cpp -o rootbrowser-installer \
              $(pkg-config --cflags --libs Qt6Widgets)
          file rootbrowser-installer
          ls -la rootbrowser-installer

      - name: Build AppDir
        run: |
          set -e
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps

          cp rootbrowser-installer AppDir/usr/bin/
          chmod +x AppDir/usr/bin/rootbrowser-installer

          cat > AppDir/usr/share/applications/rootbrowser-installer.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=RootBrowser Installer
          Comment=Setup wizard for RootBrowser
          Exec=rootbrowser-installer
          Icon=rootbrowser
          Terminal=false
          Categories=System;Utility;
          EOF

          if [ -f rootbrowser.svg ]; then
            cp rootbrowser.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          fi

          # Also put a top-level .desktop for linuxdeploy
          cp AppDir/usr/share/applications/rootbrowser-installer.desktop AppDir/

          # Icon at AppDir root
          if [ -f rootbrowser.svg ]; then
            cp rootbrowser.svg AppDir/rootbrowser.svg
          fi

          echo "--- AppDir contents ---"
          find AppDir -type f

      - name: Download linuxdeploy
        run: |
          set -e
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          file linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --version || true

      - name: Create AppImage
        run: |
          set -e
          ICON_ARG=""
          if [ -f AppDir/rootbrowser.svg ]; then
            ICON_ARG="--icon-file AppDir/rootbrowser.svg"
          fi

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/rootbrowser-installer.desktop \
            $ICON_ARG \
            --output appimage

          echo "--- Result ---"
          ls -la *.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootbrowser-installer-linux
          path: '*.AppImage'
          if-no-files-found: error

  # ═════════════════════════════════════════════
  #  GitHub Release (only on tags like v1.0.0)
  # ═════════════════════════════════════════════
  release:
    name: Publish Release
    needs: [ windows, linux ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          find artifacts -type f -exec ls -la {} \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/rootbrowser-installer-windows/*.zip
            artifacts/rootbrowser-installer-linux/*.AppImage
          generate_release_notes: true
          draft: false
          prerelease: false
